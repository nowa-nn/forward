<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <style>
      .ring { stroke: #94a3b8; stroke-width: 1.5; fill: none; opacity: 0.22; }
    </style>
  </defs>

  <!-- Base background -->
  <rect width="1440" height="800" fill="#f1f3f5" />

  <!-- Concentric Rings (Top Right) -->
  <g class="ring" transform="translate(1380, 50)">
    <circle r="60" />
    <circle r="95" />
    <circle r="130" />
    <circle r="165" />
    <circle r="200" />
    <circle r="235" />
    <circle r="270" />
    <circle r="305" />
    <circle r="340" />
    <circle r="375" />
    <circle r="410" />
    <circle r="445" />
    <circle r="480" />
    <circle r="515" />
    <circle r="550" />
  </g>

  <!-- Concentric Rings (Bottom Left) -->
  <g class="ring" transform="translate(60, 750)">
    <circle r="60" />
    <circle r="95" />
    <circle r="130" />
    <circle r="165" />
    <circle r="200" />
    <circle r="235" />
    <circle r="270" />
    <circle r="305" />
    <circle r="340" />
    <circle r="375" />
    <circle r="410" />
    <circle r="445" />
    <circle r="480" />
  </g>
</svg>
