<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1200" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <style>
      .ring { stroke: #64748b; stroke-width: 1.6; fill: none; opacity: 0.35; }
    </style>
  </defs>

  <!-- Base background -->
  <rect width="390" height="1200" fill="#f1f3f5" />

  <!-- Concentric Rings (Bottom Left - behind/around cards) -->
  <g class="ring" transform="translate(30, 850)">
    <circle r="40" />
    <circle r="70" />
    <circle r="100" />
    <circle r="130" />
    <circle r="160" />
    <circle r="190" />
    <circle r="220" />
    <circle r="250" />
    <circle r="280" />
    <circle r="310" />
    <circle r="340" />
    <circle r="370" />
    <circle r="400" />
  </g>
</svg>
